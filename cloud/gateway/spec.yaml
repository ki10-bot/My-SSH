openapi: 3.0.0
info:
  title: RemoteGate Status API
  description: |
    Authenticated HTTPS endpoint for Windows status reports.
    Fronts the Cloud Function via Yandex API Gateway.
    All POST /status requests require HMAC-SHA256 headers.
  version: 1.0.0
servers:
  - url: https://example.apigw.yandexcloud.net
    description: Replace with your API Gateway domain after deployment

paths:
  /status:
    post:
      summary: Report device status (authenticated)
      description: |
        Windows agent POSTs JSON status. Gateway forwards to Cloud Function.
        Authentication is enforced in the function (HMAC headers).
        Gateway adds rate limiting and optional JWT authorizer.
      operationId: reportStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusPayload'
            example:
              deviceId: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
              hostname: "DESKTOP-ABC123"
              username: "johndoe"
              localIps: ["192.168.1.42", "10.0.0.5"]
              osVersion: "Windows 10 Pro 19045.2006 Build 19045"
              sshStatus: "Running"
              tunnelStatus: "running"
              timestamp: "2025-11-14T12:00:00.000Z"
              version: "1.0.0"
      parameters:
        - $ref: '#/components/parameters/DeviceIdHeader'
        - $ref: '#/components/parameters/TimestampHeader'
        - $ref: '#/components/parameters/NonceHeader'
        - $ref: '#/components/parameters/SignatureHeader'
      responses:
        '200':
          description: Status accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  receivedAt: { type: string, format: date-time }
                  deviceId: { type: string }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: REPLACE_WITH_FUNCTION_ID
        tag: $latest
        payload_format_version: "1.0"
        service_account_id: REPLACE_WITH_SERVICE_ACCOUNT_ID
      x-yc-apigateway-cors:
        origin: "*"
        headers: ["X-RemoteGate-DeviceId", "X-RemoteGate-Timestamp", "X-RemoteGate-Nonce", "X-RemoteGate-Signature", "Content-Type"]
        methods: ["POST", "OPTIONS", "GET"]
      x-yc-apigateway-rate-limit:
        requests_per_second: 10
        burst: 20

  /health:
    get:
      summary: Health check (no auth)
      operationId: healthCheck
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  service: { type: string }
                  version: { type: string }
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: REPLACE_WITH_FUNCTION_ID
        tag: $latest
        payload_format_version: "1.0"

components:
  parameters:
    DeviceIdHeader:
      name: X-RemoteGate-DeviceId
      in: header
      required: true
      schema: { type: string, pattern: '^[a-zA-Z0-9\-_]{8,128}$' }
      description: Random device UUID generated on Windows install
    TimestampHeader:
      name: X-RemoteGate-Timestamp
      in: header
      required: true
      schema: { type: string, pattern: '^[0-9]{10}$' }
      description: Unix seconds (must be within 5 min of server time)
    NonceHeader:
      name: X-RemoteGate-Nonce
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 64 }
      description: Random nonce per request (replay protection)
    SignatureHeader:
      name: X-RemoteGate-Signature
      in: header
      required: true
      schema: { type: string }
      description: |
        HMAC-SHA256(base64) of "timestamp.nonce.deviceId.sha256(payload)"
        Key = HMAC_SECRET (utf8 or base64 decode)

  schemas:
    StatusPayload:
      type: object
      required: [deviceId, timestamp]
      properties:
        deviceId: { type: string, description: Device UUID }
        hostname: { type: string, nullable: true, description: Windows hostname (optional) }
        username: { type: string, nullable: true, description: Windows username (not password) }
        localIps: { type: array, items: { type: string }, description: Local IPv4s }
        osVersion: { type: string, nullable: true }
        sshStatus: { type: string, enum: [Running, Stopped, not_installed, unknown] }
        sshStartType: { type: string }
        tunnelStatus: { type: string }
        tunnelLastRun: { type: string, format: date-time, nullable: true }
        timestamp: { type: string, format: date-time }
        version: { type: string, example: "1.0.0" }
      additionalProperties: true
      maxProperties: 30

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            type: object
            properties:
              ok: { type: boolean, example: false }
              error: { type: string }
    Unauthorized:
      description: Authentication failed
      content:
        application/json:
          schema:
            type: object
            properties:
              ok: { type: boolean, example: false }
              error: { type: string, example: "Invalid signature" }
    Forbidden:
      description: Device not in allowlist
      content:
        application/json:
          schema:
            type: object
            properties:
              ok: { type: boolean, example: false }
              error: { type: string }
    PayloadTooLarge:
      description: Payload exceeds 10KB
      content:
        application/json:
          schema:
            type: object
            properties:
              ok: { type: boolean, example: false }
              error: { type: string }
    RateLimited:
      description: Too many requests
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema:
            type: object
            properties:
              ok: { type: boolean, example: false }
              error: { type: string, example: "Rate limit exceeded" }

# Notes:
# - Replace REPLACE_WITH_FUNCTION_ID and REPLACE_WITH_SERVICE_ACCOUNT_ID after creation
# - Deploy: yc serverless api-gateway create --name remotegate-gateway --spec=cloud/gateway/spec.yaml
# - Lock down invoke rights: API Gateway uses its own service account to call function
