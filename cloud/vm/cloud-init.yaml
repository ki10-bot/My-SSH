#cloud-config
# RemoteGate — cloud-init for Yandex Compute VM (Ubuntu 22.04)
# Inject via yc compute instance create --metadata-from-file user-data=cloud/vm/cloud-init.yaml
# Or paste into Yandex Console -> VM -> Metadata -> user-data
#
# SECURITY: Replace ssh_authorized_keys with your REAL public keys.
# Never commit private keys here.

package_update: true
package_upgrade: true
packages:
  - openssh-server
  - fail2ban
  - ufw
  - curl
  - jq
  - unattended-upgrades
  - needrestart

# Create tunnel user (restricted — no shell)
users:
  - name: tunneluser
    gecos: RemoteGate tunnel (restricted)
    shell: /usr/sbin/nologin
    sudo: false
    ssh_authorized_keys: []
    # IMPORTANT: Paste Windows tunnel public key (tunnel_ed25519.pub) here after provisioning:
    #   - ssh-ed25519 AAAAC3... remotegate-tunnel@WINDOWS_HOST
    # Or add later via: yc compute ssh / console

  # Replace with your admin username and key
  - name: rgadmin
    gecos: RemoteGate admin
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: sudo
    ssh_authorized_keys:
      - ssh-ed25519 REPLACE_WITH_YOUR_MAC_PUBLIC_KEY macbook@local

write_files:
  - path: /etc/ssh/banner.txt
    permissions: '0644'
    content: |
      RemoteGate bastion — authorized access only.
      All connections are logged.

  - path: /etc/fail2ban/jail.local
    permissions: '0644'
    content: |
      [sshd]
      enabled = true
      maxretry = 5
      bantime = 3600
      findtime = 600

runcmd:
  # Harden sshd
  - sed -i -E 's/^#?\s*PasswordAuthentication.*/PasswordAuthentication no/' /etc/ssh/sshd_config
  - sed -i -E 's/^#?\s*PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config
  - sed -i -E 's/^#?\s*X11Forwarding.*/X11Forwarding no/' /etc/ssh/sshd_config
  - sed -i -E 's/^#?\s*ChallengeResponseAuthentication.*/ChallengeResponseAuthentication no/' /etc/ssh/sshd_config
  - grep -q '^GatewayPorts' /etc/ssh/sshd_config || echo 'GatewayPorts no' >> /etc/ssh/sshd_config
  - grep -q '^AllowTcpForwarding' /etc/ssh/sshd_config || echo 'AllowTcpForwarding yes' >> /etc/ssh/sshd_config
  - systemctl restart sshd

  # Restrict tunnel user
  - |
    if ! grep -q "Match User tunneluser" /etc/ssh/sshd_config; then
      cat >> /etc/ssh/sshd_config <<'EOF'

      Match User tunneluser
          AllowTcpForwarding yes
          X11Forwarding no
          AllowAgentForwarding no
          PermitTTY no
          ForceCommand /bin/false
      EOF
      systemctl restart sshd
    fi

  # UFW
  - ufw --force reset
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp comment 'SSH'
  - ufw --force enable

  # fail2ban + auto-updates
  - systemctl enable fail2ban && systemctl restart fail2ban
  - systemctl enable unattended-upgrades || true

  # Ensure tunnel homedir perms
  - mkdir -p /home/tunneluser/.ssh && chmod 700 /home/tunneluser/.ssh && chown tunneluser:tunneluser /home/tunneluser/.ssh
  - touch /home/tunneluser/.ssh/authorized_keys && chmod 600 /home/tunneluser/.ssh/authorized_keys && chown tunneluser:tunneluser /home/tunneluser/.ssh/authorized_keys

final_message: "RemoteGate VM ready — add Windows tunnel key to /home/tunneluser/.ssh/authorized_keys"
